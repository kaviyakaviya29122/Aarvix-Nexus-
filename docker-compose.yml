x-worker: &worker
  build: .
  command: ["worker"]
  restart: unless-stopped
  depends_on:
    server: { condition: service_healthy }
  environment: &worker-env
    DATABASE_URL: postgres://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexus?sslmode=disable
    AMQP_URL: amqp://nexus:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    WORKER_CAPACITY: "4"
    ENABLE_CHAOS_JOBS: "true"   # testing only; remove in production

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexus
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: nexus
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["127.0.0.1:15672:15672"]
    volumes: [mqdata:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  server:
    build: .
    command: ["server"]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexus?sslmode=disable
      AMQP_URL: amqp://nexus:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@aarvix.local}
      METRICS_ADDR: ":9100"
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      retries: 20

  worker1:
    <<: *worker
    environment: { <<: *worker-env, WORKER_ID: worker1, METRICS_ADDR: ":9100" }
  worker2:
    <<: *worker
    environment: { <<: *worker-env, WORKER_ID: worker2, METRICS_ADDR: ":9100" }
  worker3:
    <<: *worker
    environment: { <<: *worker-env, WORKER_ID: worker3, METRICS_ADDR: ":9100" }

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  mqdata:
